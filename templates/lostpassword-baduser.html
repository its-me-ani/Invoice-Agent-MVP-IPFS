{% extends "base.html" %}

{% block head %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}" type="text/css" />
{% endblock %}

{% block body %}
<div class="auth-container">
  <!-- Left Side: Illustration -->
  <div class="auth-illustration" style="background: linear-gradient(135deg, #ef4444 0%, #b91c1c 100%);">
    <svg viewBox="0 0 500 400" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="grad4" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%" style="stop-color:rgb(255,255,255);stop-opacity:0.6" />
          <stop offset="100%" style="stop-color:rgb(255,255,255);stop-opacity:0.2" />
        </linearGradient>
      </defs>
      <path
        d="M47.7,-74.4C60.3,-64.8,68.3,-50.2,74.7,-35.1C81.1,-20,85.9,-4.5,82.8,9.4C79.7,23.3,68.7,35.6,57.1,44.9C45.5,54.2,33.3,60.5,20.4,66.1C7.5,71.7,-6.1,76.6,-19.4,75C-32.7,73.4,-45.7,65.2,-55.9,54.4C-66.1,43.6,-73.5,30.2,-75.9,15.9C-78.3,1.6,-75.7,-13.6,-68.2,-26.8C-60.7,-40,-48.3,-51.2,-34.9,-60.5C-21.5,-69.8,-7.1,-77.2,6.4,-87.1"
        transform="translate(250 200) scale(2.2)" fill="url(#grad4)" />
      <!-- Warning Icon -->
      <path d="M250 120 L 190 240 H 310 Z" stroke="#fff" stroke-width="4" fill="none" stroke-linejoin="round" />
      <line x1="250" y1="170" x2="250" y2="210" stroke="#fff" stroke-width="4" stroke-linecap="round" />
      <circle cx="250" cy="225" r="3" fill="#fff" />
    </svg>
  </div>

  <!-- Right Side: Form -->
  <div class="auth-form-container">
    <div class="auth-form-header">
      <h1 class="auth-title">User Not Found</h1>
      <p class="auth-subtitle" style="color: var(--error-color);">The email <strong>{{ reguser }}</strong> is invalid.
      </p>
    </div>

    <form method="POST" action="/lostpw">
      <div class="form-group">
        <label for="email" class="form-label">Re-enter Email Address</label>
        <input type="text" id="email" name="email" class="form-input" placeholder="name@example.com" required
          style="border-color: var(--error-color);">
      </div>

      <button type="submit" class="btn-primary">Try Again</button>
    </form>

    <div class="auth-footer">
      <a href="{{ url_for('login_get') }}" class="auth-link">Back to Login</a>
    </div>
  </div>
</div>
{% endblock %}
