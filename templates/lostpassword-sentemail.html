{% extends "base.html" %}

{% block head %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}" type="text/css" />
{% endblock %}

{% block body %}
<div class="auth-container">
  <!-- Left Side: Illustration -->
  <div class="auth-illustration" style="background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);">
    <svg viewBox="0 0 500 400" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="grad5" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%" style="stop-color:rgb(255,255,255);stop-opacity:0.6" />
          <stop offset="100%" style="stop-color:rgb(255,255,255);stop-opacity:0.2" />
        </linearGradient>
      </defs>
      <path
        d="M47.7,-74.4C60.3,-64.8,68.3,-50.2,74.7,-35.1C81.1,-20,85.9,-4.5,82.8,9.4C79.7,23.3,68.7,35.6,57.1,44.9C45.5,54.2,33.3,60.5,20.4,66.1C7.5,71.7,-6.1,76.6,-19.4,75C-32.7,73.4,-45.7,65.2,-55.9,54.4C-66.1,43.6,-73.5,30.2,-75.9,15.9C-78.3,1.6,-75.7,-13.6,-68.2,-26.8C-60.7,-40,-48.3,-51.2,-34.9,-60.5C-21.5,-69.8,-7.1,-77.2,6.4,-87.1"
        transform="translate(250 200) scale(2.2)" fill="url(#grad5)" />
      <!-- Mail Icon -->
      <rect x="180" y="160" width="140" height="90" rx="5" ry="5" fill="none" stroke="#fff" stroke-width="4" />
      <polyline points="180,160 250,210 320,160" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round"
        stroke-linejoin="round" />
    </svg>
  </div>

  <!-- Right Side: Content -->
  <div class="auth-form-container">
    <div class="auth-form-header">
      <h1 class="auth-title">Check Your Email</h1>
      <p class="auth-subtitle">We've sent password reset instructions to <strong>{{ reguser }}</strong></p>
    </div>

    <div style="text-align: center; margin: 2rem 0;">
      <p>If you don't see the email, check your spam folder.</p>
    </div>

    <div class="auth-footer">
      <a href="{{ url_for('login_get') }}" class="btn-primary"
        style="text-decoration:none; display:inline-block; width:auto; padding: 0.75rem 2rem;">Back to Login</a>
    </div>
  </div>
</div>
{% endblock %}
