<!DOCTYPE html>
<html>

<head>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
  <title>Socialcalc AI</title>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/header.css') }}" type="text/css" />
  {% block head %} {% endblock %}
</head>

<body>

  {% block header %}
  <header class="main-header">
    <div class="header-content">
      <a href="/" class="header-brand">
        <!-- Optional Logo SVG -->
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
          <line x1="3" y1="9" x2="21" y2="9"></line>
          <line x1="9" y1="21" x2="9" y2="9"></line>
        </svg>
        Socialcalc AI
      </a>

      <div class="header-user-menu">
        {% if session['user'] %}
        <div class="user-display">
          <div class="user-avatar-placeholder">
            {{ session['user'][0]|upper }}
          </div>
          <span>{{ session['user'] }}</span>
        </div>
        {% block header_actions %}{% endblock %}
        <a href="{{ url_for('logout_get') }}" class="btn-logout"
          onclick="return confirm('Are you sure you want to log out?');">Log out</a>
        {% endif %}
      </div>
    </div>
  </header>
  {% endblock %}

  <div class="container">
    {% block body %} {% endblock %}
  </div>
  {% block bottom %} {% endblock %}
</body>

</html>
