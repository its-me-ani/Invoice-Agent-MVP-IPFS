{% extends "base.html" %}

{% block head %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}" type="text/css" />
{% endblock %}

{% block body %}
<div class="auth-container">
  <!-- Left Side: Illustration -->
  <div class="auth-illustration" style="background: linear-gradient(135deg, #ef4444 0%, #b91c1c 100%);">
    <svg viewBox="0 0 500 400" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="gradErr" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%" style="stop-color:rgb(255,255,255);stop-opacity:0.6" />
          <stop offset="100%" style="stop-color:rgb(255,255,255);stop-opacity:0.2" />
        </linearGradient>
      </defs>
      <path
        d="M42.2,-72.6C54.8,-66,65.2,-54.6,73.5,-41.8C81.8,-29,88.1,-14.8,87.6,-0.8C87,13.2,79.6,26.9,70.5,39.1C61.3,51.3,50.3,62,37.8,69.5C25.3,76.9,11.3,81.2,-2.2,84.9C-15.7,88.7,-29.1,92,-40.8,85C-52.6,78,-62.7,60.8,-70.7,44.7C-78.7,28.6,-84.6,13.6,-83.4,-0.7C-82.2,-15,-73.9,-28.7,-64.2,-41.2C-54.5,-53.7,-43.4,-65,-30.9,-71.7C-18.4,-78.4,-4.5,-80.5,8.1,-78.3"
        transform="translate(250 200) scale(2.2)" fill="url(#gradErr)" />
      <!-- User Exists Icon -->
      <circle cx="250" cy="200" r="50" fill="none" stroke="#fff" stroke-width="4" />
      <path d="M215 230 Q 250 170 285 230" stroke="#fff" stroke-width="4" fill="none" />
      <circle cx="235" cy="190" r="5" fill="#fff" />
      <circle cx="265" cy="190" r="5" fill="#fff" />
    </svg>
  </div>

  <!-- Right Side: Form -->
  <div class="auth-form-container">
    <div class="auth-form-header">
      <h1 class="auth-title">Account Exists</h1>
      <p class="auth-subtitle" style="color: var(--error-color);">The email <strong>{{ reguser }}</strong> is already
        registered.</p>
    </div>

    <form method="POST" action="{{ url_for('register_post') }}">
      <div class="form-group">
        <label for="email" class="form-label">Try a different Email</label>
        <input type="text" id="email" name="email" class="form-input" placeholder="name@example.com" required
          style="border-color: var(--error-color);">
      </div>
      <div class="form-group">
        <label for="password" class="form-label">Password</label>
        <input type="password" id="password" name="password" class="form-input" placeholder="Create a password"
          required>
      </div>

      <button type="submit" class="btn-primary">Register</button>
    </form>

    <div class="auth-footer">
      Want to login instead? <a href="{{ url_for('login_get') }}" class="auth-link">Log in</a>
    </div>
  </div>
</div>
{% endblock %}
