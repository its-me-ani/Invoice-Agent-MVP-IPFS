{% extends "base.html" %}

{% block head %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}" type="text/css" />
{% endblock %}

{% block header %}{% endblock %}

{% block body %}
<div class="auth-container">
  <!-- Left Side: Illustration -->
  <div class="auth-illustration" style="background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);">
    <svg viewBox="0 0 500 400" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="grad3" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%" style="stop-color:rgb(255,255,255);stop-opacity:0.6" />
          <stop offset="100%" style="stop-color:rgb(255,255,255);stop-opacity:0.2" />
        </linearGradient>
      </defs>
      <!-- Background Blob -->
      <path
        d="M47.7,-74.4C60.3,-64.8,68.3,-50.2,74.7,-35.1C81.1,-20,85.9,-4.5,82.8,9.4C79.7,23.3,68.7,35.6,57.1,44.9C45.5,54.2,33.3,60.5,20.4,66.1C7.5,71.7,-6.1,76.6,-19.4,75C-32.7,73.4,-45.7,65.2,-55.9,54.4C-66.1,43.6,-73.5,30.2,-75.9,15.9C-78.3,1.6,-75.7,-13.6,-68.2,-26.8C-60.7,-40,-48.3,-51.2,-34.9,-60.5C-21.5,-69.8,-7.1,-77.2,6.4,-87.1"
        transform="translate(250 200) scale(2.2)" fill="url(#grad3)" />
      <!-- Lock / key Icon -->
      <rect x="200" y="180" width="100" height="80" rx="10" ry="10" fill="none" stroke="#fff" stroke-width="4" />
      <path d="M250 180 V 150 A 30 30 0 0 0 190 150 V 180" stroke="#fff" stroke-width="4" fill="none"
        transform="translate(30,0)" />
      <circle cx="250" cy="220" r="8" fill="#fff" />
    </svg>
  </div>

  <!-- Right Side: Form -->
  <div class="auth-form-container">
    <div class="auth-form-header">
      <h1 class="auth-title">Forgot Password?</h1>
      <p class="auth-subtitle">Enter your email address to reset your password.</p>
    </div>

    <form method="POST" action="/lostpw">
      <div class="form-group">
        <label for="email" class="form-label">Email Address</label>
        <input type="text" id="email" name="email" class="form-input" placeholder="name@example.com" required>
      </div>

      <button type="submit" class="btn-primary">Send Reset Link</button>
    </form>

    <div class="auth-footer">
      Remember your password? <a href="{{ url_for('login_get') }}" class="auth-link">Log in</a>
    </div>
  </div>
</div>
{% endblock %}
